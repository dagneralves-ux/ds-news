name: Atualizar notícias

on:
  schedule:
    - cron: '7,37 * * * *'     # a cada 30 minutos
  workflow_dispatch:           # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # histórico completo: necessário para reaproveitar o commit do robô sem apagar o histórico

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar notícias
        run: node scripts/atualizar.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Salvar mudanças
        run: |
          git config user.name  "ds-news-bot"
          git config user.email "ds-news-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          elif [ "$(git log -1 --format=%an)" = "ds-news-bot" ]; then
            # O último commit já é do robô: reaproveita esse commit em vez de criar mais um.
            # Assim o histórico do repositório não cresce a cada 30 minutos (só com as suas edições).
            git commit --amend --no-edit -q
            git push --force-with-lease -q
          else
            git commit -m "Atualiza notícias"
            git push
          fi
