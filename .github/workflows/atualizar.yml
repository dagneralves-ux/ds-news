name: Atualizar notícias

on:
  schedule:
    - cron: '7,37 * * * *'     # a cada 30 minutos
  workflow_dispatch:           # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar notícias
        run: node scripts/atualizar.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Salvar mudanças
        run: |
          git config user.name  "ds-news-bot"
          git config user.email "ds-news-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "Atualiza notícias"
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Não consegui enviar depois de 3 tentativas."
          exit 1
